<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Kanban com Supabase</title>

  <!-- ========== CSS ========== -->
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Seu CSS customizado (style.css) -->
  <link rel="stylesheet" href="style.css" />

  <!-- ========== SCRIPTS (CDN) ========== -->
  <!-- React + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel standalone (para transformar JSX no navegador) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide React (ícones) -->
  <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>
  <!-- Axios (requisições HTTP) -->
  <script src="https://unpkg.com/axios@1.6.2/dist/axios.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- dnd-kit (drag & drop) -->
  <script src="https://unpkg.com/@dnd-kit/core@6.0.8/dist/index.umd.js"></script>
  <script src="https://unpkg.com/@dnd-kit/utilities@3.2.1/dist/index.umd.js"></script>
</head>
<body>
  <!-- ========== ROOT ========== -->
  <div id="root">
    <div class="flex justify-center items-center h-screen">
      <p class="text-gray-500 text-xl">Carregando CRM...</p>
    </div>
  </div>

  <!-- ========== SEU JAVASCRIPT (app.js) ========== -->
  <!-- 
    IMPORTANTE: 
    - O arquivo app.js deve conter a Parte 1 + Parte 2 (nessa ordem).
    - O Babel vai transpilar o código JSX.
  -->
 <!-- Garanta que o app.js só rode DEPOIS de todos os scripts estarem totalmente carregados -->
<script type="text/babel" src="app.js" defer></script>

  <!-- 
    Caso queira usar o JS inline (tudo no HTML), descomente o bloco abaixo e remova o src="app.js".
    Mas lembre-se de colar TODO o conteúdo da Parte 1 e Parte 2 dentro do bloco.
  -->
  <!--
  <script type="text/babel">
    // COLE AQUI TODO O CONTEÚDO DE app.js (Parte 1 + Parte 2)
  </script>
  -->
</body>
</html>
